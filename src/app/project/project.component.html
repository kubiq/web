
<article class="card-modern w-100 h-100 flex flex-column overflow-hidden">

  @for (src of project().img; track src) {
    <img [src]="src"
      class="w-100 cover-fit"
      style="height: 140px; object-position: top"
      [alt]="project().desc">
  }

  <div class="pa3 flex flex-column flex-auto">
    <div class="flex items-start justify-between mb2">
      <h2 class="f5 fw6 ma0" style="color: var(--text-primary)">{{project().name}}</h2>
      @for (url of project().web; track url) {
        <a [href]="url" class="project-link f6" target="_blank"
          rel="noreferrer" referrerpolicy="no-referrer">View</a>
      }
    </div>

    <p class="f6 lh-copy mt0 mb3" style="color: var(--text-secondary)">
      {{project().desc}}
    </p>

    @if (project().techs) {
      <div class="mt-auto">
        <div class="flex flex-wrap" style="margin: -0.125rem">
          @for (t of project().techs; track t) {
            <span class="tech-tag">{{t}}</span>
          }
        </div>
      </div>
    }
  </div>

</article>
